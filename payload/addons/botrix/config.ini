;-------------------------------------------------------------------------------
; Weapons. delay = CycleTime in ms. Reload times are guesses (marked '?').
; Staff and Kull blasts explode: 'range 250 ...' keeps bots from firing at point blank (160 was not enough: bots killed themselves).
; Their max range is 2000 (was 2500): a third of their hits on tls_erebus came from beyond 2000 units, at bots
; standing still; a slow blast that far wouldn't hit a moving player (2026-10-27).
; Max ranges keep bots from emptying their clips at enemies across the map. P90 / P90D / pistol: measured hits
; (2026-10-27) stop around 1000 units; beyond the max range bots take another weapon or come closer.
; P90 / P90D: 'type pistol' so that bots press attack for each shot. Botrix holds attack between the shots of a
; 'rifle', and these fire once per press (they have a semi-automatic mode): 2 hits in 7 minutes (2026-10-27).
;-------------------------------------------------------------------------------
[StargateTheLastStand.weapons]
weapon_knife = type melee, preference lowest, delay 800, damage 50, holster 500,\
    range 0 70

weapon_hdevice = team goauld, type melee, preference low, delay 1750, damage 60,\
    holster 500, range 0 150

weapon_pistol = team tauri, type pistol, preference low, clip 12, damage 23,\
    delay 150, reload 2000?, holster 500, default_ammo 84, max_ammo 96, range 0 1000

weapon_zat = type pistol, preference normal, clip 45, damage 12, delay 400,\
    reload 1000?, holster 500, default_ammo 45, max_ammo 45, range 0 1500

weapon_p90 = team tauri, type pistol, preference high, clip 50, damage 20,\
    delay 75, reload 2500?, holster 700, default_ammo 500, max_ammo 550, range 0 1100

weapon_p90D = team tauri, type pistol, preference high, clip 50, damage 20,\
    delay 75, reload 2500?, holster 700, default_ammo 500, max_ammo 550, range 0 1100

weapon_g36 = team tauri, type rifle, preference high, clip 30, damage 23,\
    delay 87, reload 2500?, holster 700, default_ammo 500, max_ammo 530, range 0 3000

weapon_awp = team tauri, type rifle, preference normal, clip 5, damage 102,\
    delay 2000, reload 3000?, holster 1000, default_ammo 100, max_ammo 105

; Staff and Kull: "type rifle" made bots hold the trigger, so they fired at the game's own rate whatever the
; delay (staff 0.75 s, Kull 0.18 s: 5.5 bolts a second, two kill). The user found the Kull far too strong and
; the staff shots chained too fast (2026-10-28): "type pistol" presses once per delay. The weapons themselves
; are unchanged, for players too.
; Kull 400 -> 550 ms the same day: still the top killer on tls_abydos (20 of 36 kills).
weapon_staff = team goauld, type pistol, preference high, clip 45, damage 70,\
    delay 1100, reload 1000?, holster 700, default_ammo 45, max_ammo 45, range 250 2000

weapon_kullblaster = team goauld, type pistol, preference highest, clip 45,\
    damage 50, delay 550, reload 1000?, holster 700, default_ammo 45, max_ammo 45, range 250 2000

weapon_grenade = team tauri, type grenade, preference lowest, damage 150, clip 1,\
    delay 2000, hold 400, reload 1000, holster 1000, aim foot, default_ammo 2,\
    max_ammo 2

weapon_tac = team goauld, type grenade, preference lowest, damage 80, clip 1,\
    delay 2000, hold 400, reload 1000, holster 1000, aim foot, default_ammo 3,\
    max_ammo 3
