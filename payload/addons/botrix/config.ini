;*******************************************************************************
; Botrix configuration for Stargate: The Last Stand (sgtls).
; Weapon numbers come from the mod's scripts/*.ctx (ICE key Fr6UhPO7).
;
; Warning: when '\' continues a line, nothing may follow it on that line.
;*******************************************************************************

[General]
console_log_level = info
file_log = botrix.log
file_log_level = info
name_with_intelligence = off
names = O'Neill, Carter, Jackson, Teal'c, Hammond, Makepeace, Ferretti,\
        Kawalsky, Reynolds, Dixon, Mitchell, Vala, Bra'tac, Rya'c,\
        Apophis, Heru'ur, Sokar, Cronus, Nirrti, Yu, Ba'al, Anubis, Herak

[User access]
STEAM_ID_LAN = waypoint bot config

;-------------------------------------------------------------------------------
; Teams are listed by their "jointeam" number.
;-------------------------------------------------------------------------------
[StargateTheLastStand.mod]
games = Source SDK Base 2007, orangebox
mods = sgtls
bot = sgtls
teams = unassigned, spectators, tauri, goauld

[StargateTheLastStand.vars]
max_health = 100
max_armor = 100
player_width = 32
player_height = 72
player_height_crouched = 36
player_eye = 64
player_eye_crouched = 28
velocity_crouch = 68
velocity_walk = 150
velocity_run = 205
velocity_sprint = 325
obstacle_height_no_jump = 18
jump_height = 20
jump_height_crouched = 56
