// Stargate Redial bots: settings for tls_lockdown only. The bot plugin runs this file once the map is loaded;
// these settings go back to their defaults at the next map.
// Indoors most fights are closer than 250 units, where the Goa'uld bots don't fire their staff or Kull blaster
// (the blast hurts the shooter). From 210 units the Goa'uld win about 4 rounds in 10 between bots
// (120: nearly all of them, 250: about 1 in 10).
sgtls_mapweapon weapon_staff range 210 2000
sgtls_mapweapon weapon_kullblaster range 210 2000
