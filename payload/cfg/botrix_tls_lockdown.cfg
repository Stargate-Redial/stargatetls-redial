// Stargate Redial bots: settings for tls_lockdown only. The bot plugin runs this file once the map is loaded;
// these settings go back to their defaults at the next map.
// Indoors most fights are closer than 250 units, where the Goa'uld bots didn't fire their staff or Kull blaster
// (the blast hurts the shooter): they fought with their side arms and the Tau'ri won every round between bots.
// From 120 units the Goa'uld win some rounds and kills are even (self-kills unchanged).
sgtls_mapweapon weapon_staff range 120 2000
sgtls_mapweapon weapon_kullblaster range 120 2000
