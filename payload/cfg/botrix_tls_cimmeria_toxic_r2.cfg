// Stargate Redial bots: settings for tls_cimmeria_toxic_r2 only. The bot plugin runs this file once the map is loaded;
// these settings go back to their defaults at the next map.
// The bots open the doors on their way (panels, +use, sliding doors).
sgtls_opendoors 1
// Open map: between bots the Goa'uld made 72 % of the kills (staff and Kull blasts from up to 2000 units, the P90 reaches
// 1100). The same limit as on tls_dakara_rebuilt_b3, 1100: about 57 % (2026-11-10, 2 x 10 min; 55 % with 800).
sgtls_mapweapon weapon_staff range 250 1100
sgtls_mapweapon weapon_kullblaster range 250 1100
