// Stargate Redial bots: settings for tls_erebus only. The bot plugin runs this file once the map is loaded;
// these settings go back to their defaults at the next map.
// At most one Kull Warrior per team among the bots (humans choose freely): with the repaired waypoints the
// Tau'ri win about 6 rounds in 10 between bots (4 in 10 without the cap, none before the waypoint repair).
sgtls_kullmax 1
// Bots keep going where they were going when a checkpoint falls or a round starts, as in 1.0.1. With a new
// destination at each change (1.0.2), the Goa'uld held checkpoint 0 from the start of each round: the Tau'ri won
// about 1 round in 5 on the 24/7 server (about 1 in 2 before, and again with this line in tests).
sgtls_stagerepick 0
// Redial 1.0.4: the bot behaviours added for the new maps stay off here (this map plays as with 1.0.3).
sgtls_feature all 0
